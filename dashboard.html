<!-- dashboard.html — content fragment loaded by router.js into #page-content -->
<section class="auth-bg min-h-[calc(100vh-160px)] px-4 py-10 max-w-6xl mx-auto">

    <div class="mb-6">
        <h1 class="text-3xl font-extrabold flex items-center gap-2">
            <i class="fa-solid fa-gauge-high text-purple-600"></i>
            Live Fleet Dashboard
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">All helmets connected to the Helmet AI platform</p>
    </div>

    <div id="loading" class="text-center py-12 text-gray-500 dark:text-gray-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
        <p class="mt-2">Loading fleet data…</p>
    </div>

    <div id="content" class="hidden">
        <!-- Stats cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4">
                <p class="text-xs text-gray-500 dark:text-gray-400">Workers</p>
                <p class="text-2xl font-extrabold text-purple-600" id="s-workers">—</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4">
                <p class="text-xs text-gray-500 dark:text-gray-400">Helmets</p>
                <p class="text-2xl font-extrabold text-purple-600" id="s-helmets">—</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4">
                <p class="text-xs text-gray-500 dark:text-gray-400">Active now</p>
                <p class="text-2xl font-extrabold text-green-600" id="s-active">—</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4">
                <p class="text-xs text-gray-500 dark:text-gray-400">Open alerts</p>
                <p class="text-2xl font-extrabold text-red-600" id="s-alerts">—</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4 col-span-2 md:col-span-1">
                <p class="text-xs text-gray-500 dark:text-gray-400">Readings</p>
                <p class="text-2xl font-extrabold text-pink-600" id="s-readings">—</p>
            </div>
        </div>

        <!-- Filter (cookie demo) -->
        <div class="mb-6 flex flex-wrap items-center gap-2 text-sm">
            <span class="text-gray-500 dark:text-gray-400 mr-2">Filter:</span>
            <a href="#" data-view="all"     class="filter-pill px-4 py-1.5 rounded-full font-semibold transition">All</a>
            <a href="#" data-view="active"  class="filter-pill px-4 py-1.5 rounded-full font-semibold transition">Active</a>
            <a href="#" data-view="offline" class="filter-pill px-4 py-1.5 rounded-full font-semibold transition">Offline / Maintenance</a>
            <span class="text-xs text-gray-400 italic ml-auto">
                <i class="fa-solid fa-cookie-bite"></i> Filter saved in a cookie for 7 days
            </span>
        </div>

        <!-- Helmets grid -->
        <div id="helmets-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="empty-state" class="text-center py-12 text-gray-500 dark:text-gray-400 hidden">
            <i class="fa-solid fa-circle-info text-2xl mb-2"></i>
            <p>No helmets match this filter.</p>
        </div>
    </div>

</section>
