<!-- register.html — content fragment loaded by router.js into #page-content -->
<section class="auth-bg min-h-[calc(100vh-160px)] flex items-center justify-center px-4 py-12">
    <div class="auth-card w-full max-w-xl bg-white dark:bg-slate-800 rounded-2xl shadow-xl border-t-4 border-purple-600 p-8">

        <div class="flex items-center justify-center gap-2 mb-2">
            <i class="fa-solid fa-user-plus text-purple-600 text-xl"></i>
            <h1 class="text-2xl font-extrabold">Create your account</h1>
        </div>
        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mb-6">Join Helmet AI and link your safety helmet</p>

        <!-- Error / success boxes — shown by register-form.js based on URL params -->
        <div id="error-box"   class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium border bg-red-50   dark:bg-red-900/30   text-red-700   dark:text-red-300   border-red-200   dark:border-red-800">
            <i class="fa-solid fa-circle-exclamation mr-1"></i><span id="error-text"></span>
        </div>
        <div id="success-box" class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium border bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300 border-green-200 dark:border-green-800">
            <i class="fa-solid fa-circle-check mr-1"></i>
            Account created. <a href="#login" class="underline font-semibold">Sign in</a>
        </div>

        <form method="POST" action="api/register.php" class="space-y-4">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Username</label>
                    <input type="text" name="username" required
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">National ID</label>
                    <input type="text" name="national_id" required
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Password</label>
                    <input id="password" type="password" name="password" required
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Confirm Password</label>
                    <input id="confirm" type="password" name="confirm" required
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
                    <p id="pwd-note" class="text-xs mt-1"></p>
                </div>
            </div>

            <hr class="border-gray-200 dark:border-gray-700">

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Full Name</label>
                <input type="text" name="full_name" required
                class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Age</label>
                    <input type="number" name="age" min="18" max="70"
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Job Title</label>
                    <input type="text" name="job_title" required placeholder="Site Engineer / Safety Officer / ..."
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-gray-300 mb-1">Phone</label>
                <input type="tel" name="phone"
                class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
                Create account <i class="fa-solid fa-user-check ml-1"></i>
            </button>
        </form>

        <p class="text-center text-sm mt-6 text-gray-600 dark:text-gray-400">
            Already have an account?
            <a href="#login" class="text-purple-600 dark:text-purple-400 font-semibold hover:underline">Sign in</a>
        </p>
    </div>
</section>
